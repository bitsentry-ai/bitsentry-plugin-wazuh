name: Knip
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: knip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find PRs stacked on this one
        id: stack
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$GITHUB_HEAD_REF" --state open --json number --jq length)
          echo "stacked=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Lower PRs in a stack may add code that a later PR uses, so only the top
      # of a stack (or a standalone PR) must pass.
      - name: Knip
        run: pnpm knip
        continue-on-error: ${{ steps.stack.outputs.stacked == 'true' }}
