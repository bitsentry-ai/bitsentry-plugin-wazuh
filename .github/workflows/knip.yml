name: Knip
on:
  pull_request:
    # edited: a PR whose base changes (for example retargeted to main after the
    # PR below it merges) is checked again.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: knip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check whether this PR is part of a stack
        id: stack
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$GITHUB_HEAD_REF" --state open --json number --jq length)
          stacked=false
          if [ "$GITHUB_BASE_REF" != "$DEFAULT_BRANCH" ] || [ "$count" -gt 0 ]; then stacked=true; fi
          echo "stacked=$stacked" >> "$GITHUB_OUTPUT"
      # A PR in a stack (based on another PR, or with a PR based on it) may add code
      # that another PR in the stack uses, so only standalone PRs must pass.
      - name: Knip
        run: pnpm knip
        continue-on-error: ${{ steps.stack.outputs.stacked == 'true' }}
